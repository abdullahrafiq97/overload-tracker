<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Overload" />
<meta name="theme-color" content="#0E1116" />
<title>Overload</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1116; --panel:#171B22; --panel2:#1E242D; --line:#2A313B;
  --text:#E6EAF0; --dim:#8A94A3; --faint:#4A5260;
  --accent:#F5A524; --accentInk:#1a1205; --up:#4ADE80; --upInk:#062012; --warn:#F87171;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--bg);}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--text);font-size:15px;line-height:1.45;}
button,input,select{font:inherit;color:inherit;}
.wrap{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom));min-height:100vh;}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.brand{display:flex;align-items:center;gap:10px;}
.mark{color:var(--accent);font-size:22px;line-height:1;}
.head h1{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;letter-spacing:.14em;margin:0;}
.week{display:flex;gap:4px;align-items:center;}
.week i{width:9px;height:22px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);display:block;}
.week i.on{background:var(--accent);border-color:var(--accent);}
.week span{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);margin-left:6px;}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(14,17,22,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));}
.tabs-in{max-width:640px;margin:0 auto;display:flex;gap:6px;}
.tab{flex:1;padding:10px 4px;background:transparent;border:none;color:var(--dim);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;border-radius:9px;cursor:pointer;}
.tab.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line);}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
.h2{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;margin:0 0 4px;}
.eyebrow{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin:0 0 8px;}
.muted{color:var(--dim);font-size:13px;}
.mono{font-family:'JetBrains Mono',monospace;}
.coach{border-color:#3a3020;background:linear-gradient(180deg,#1c1a14,#171B22);}
.coach .who{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.coach .who b{font-family:'Space Grotesk',sans-serif;font-size:12px;letter-spacing:.12em;color:var(--accent);}
.coach p{margin:0 0 8px;}
.coach p:last-child{margin-bottom:0;}
.coach ul{margin:4px 0 8px;padding-left:18px;}
.coach li{margin:2px 0;}
.btn{border:none;border-radius:10px;font-family:'Space Grotesk',sans-serif;font-weight:600;cursor:pointer;padding:12px 14px;font-size:15px;}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.primary{background:var(--accent);color:var(--accentInk);}
.go{background:var(--up);color:var(--upInk);}
.ghost{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line);}
.danger{background:transparent;color:var(--warn);box-shadow:inset 0 0 0 1px #4a2a2a;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.full{width:100%;}
.row{display:flex;gap:8px;align-items:center;}
.row.wrapx{flex-wrap:wrap;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:7px 12px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:20px;font-size:13px;cursor:pointer;}
.chip.on{background:var(--accent);color:var(--accentInk);border-color:var(--accent);font-weight:600;}
.chip.next{border-color:var(--accent);color:var(--text);}
input.in,select.in{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px;font-size:15px;width:100%;}
input.in:focus,select.in:focus{outline:none;border-color:var(--accent);}
.ex{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;margin-bottom:10px;}
.ex.done{border-color:#24533a;}
.ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.ex-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;background:var(--panel2);color:var(--dim);border:1px solid var(--line);margin-right:4px;}
.tag.up{color:var(--up);border-color:#24533a;background:#10221a;}
.tag.stuck{color:var(--accent);border-color:#4a3a1a;background:#221a0e;}
.tip{font-size:13px;color:#cfd5de;margin:6px 0 8px;padding:8px 10px;background:var(--panel2);border-radius:9px;border-left:3px solid var(--accent);}
.tip.up{border-left-color:var(--up);}
.last{font-size:12px;color:var(--dim);margin-top:2px;}
.sets{display:grid;grid-template-columns:22px 1fr 14px 1fr 44px;gap:6px;align-items:center;margin-top:4px;}
.sets .n{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--faint);text-align:center;}
.sets .x{color:var(--faint);text-align:center;font-size:13px;}
.sets input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 6px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:16px;width:100%;}
.sets input:focus{outline:none;border-color:var(--accent);}
.sets input::placeholder{color:var(--faint);}
.chk{height:42px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--faint);font-size:18px;cursor:pointer;}
.chk.on{background:var(--up);border-color:var(--up);color:var(--upInk);}
.mini{background:none;border:none;color:var(--dim);font-size:12px;cursor:pointer;padding:6px 4px;text-transform:uppercase;letter-spacing:.06em;font-family:'Space Grotesk',sans-serif;}
.mini:hover{color:var(--text);}
.mini.red{color:var(--warn);}
.timer{position:fixed;left:0;right:0;top:0;z-index:30;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;background:#10221a;border-bottom:1px solid #24533a;display:none;}
.timer.show{display:block;}
.timer-in{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;color:var(--up);}
.bar{height:3px;background:#24533a;border-radius:2px;margin-top:6px;overflow:hidden;max-width:640px;margin-left:auto;margin-right:auto;}
.bar i{display:block;height:100%;background:var(--up);width:100%;transition:width 1s linear;}
.sticky{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:15;padding:8px 16px;}
.sticky-in{max-width:640px;margin:0 auto;display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px;box-shadow:0 -8px 24px rgba(0,0,0,.4);}
.sticky-in .muted{flex:1;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;padding:6px;border-bottom:1px solid var(--line);font-weight:600;}
td{padding:8px 6px;border-bottom:1px solid rgba(42,49,59,.5);vertical-align:top;}
tr:last-child td{border-bottom:none;}
.d-up{color:var(--up);font-family:'JetBrains Mono',monospace;font-size:12px;}
.d-dn{color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:12px;}
.d-eq{color:var(--faint);font-family:'JetBrains Mono',monospace;font-size:12px;}
.stat3{display:flex;gap:8px;margin:10px 0;}
.stat3>div{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px;text-align:center;}
.stat3 b{display:block;font-family:'JetBrains Mono',monospace;font-size:20px;}
.stat3 span{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(42,49,59,.5);gap:10px;}
.list-item:last-child{border-bottom:none;}
.plan-item{display:grid;grid-template-columns:1fr auto;gap:6px;padding:8px 0;border-bottom:1px solid rgba(42,49,59,.5);}
.plan-item:last-child{border-bottom:none;}
.stepper{display:flex;align-items:center;gap:4px;}
.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;}
.stepper span{min-width:22px;text-align:center;font-family:'JetBrains Mono',monospace;}
.meta-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px;}
.meta-row label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;}
.meta-row input{padding:8px;font-size:14px;}
pre.sum{white-space:pre-wrap;font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--panel2);border-radius:10px;padding:10px;margin:8px 0;color:#cfd5de;}
.empty{color:var(--dim);text-align:center;padding:24px 8px;}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom));background:var(--up);color:var(--upInk);padding:9px 16px;border-radius:20px;font-weight:600;font-size:13px;z-index:40;display:none;}
.toast.show{display:block;}
svg text{font-family:'JetBrains Mono',monospace;}
@media(prefers-reduced-motion:reduce){*{transition:none!important;}}
.sg{position:relative;}
.sg-list{margin-top:6px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2);}
.sg-list:empty{display:none;}
.sg-opt{display:block;width:100%;text-align:left;padding:11px 12px;background:none;border:none;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;}
.sg-opt:last-child{border-bottom:none;}
.sg-opt:active,.sg-opt:hover{background:#262d38;}
.sg-opt small{color:var(--dim);font-size:11px;margin-left:6px;}
.sg-opt.new{color:var(--accent);}
.tag.opt{color:#9fb3c8;}
body.typing .tabs,body.typing .sticky{display:none!important;}
.swap-box{margin:8px 0 4px;padding:10px;border:1px dashed var(--line);border-radius:10px;}
</style>
</head>
<body>
<div class="timer" id="timer"><div class="timer-in"><span id="timerText">Rest</span><button class="mini" data-act="timerSkip" style="color:var(--up)">Skip</button></div><div class="bar"><i id="timerBar"></i></div></div>
<div class="wrap">
  <header class="head">
    <div class="brand"><span class="mark">▲</span><h1>OVERLOAD</h1></div>
    <div class="week" id="weekStrip" title="Sessions this week"></div>
  </header>
  <main id="main"></main>
</div>
<div class="sticky" id="sticky" style="display:none"></div>
<nav class="tabs"><div class="tabs-in">
  <button class="tab on" data-act="tab" data-arg="today">Today</button>
  <button class="tab" data-act="tab" data-arg="history">History</button>
  <button class="tab" data-act="tab" data-arg="progress">Progress</button>
  <button class="tab" data-act="tab" data-arg="plan">Plan</button>
</div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input id="importFile" type="file" accept="application/json,.json" style="display:none" />

<script>
"use strict";
/* ================= helpers ================= */
var K1="overload_workouts_v1", K2="overload_v2", KD="overload_draft_v2";
var PROGRAM_REV=2;
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,10);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return(n<10?"0":"")+n;}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function todayStr(){return ymd(new Date());}
function dObj(s){var p=String(s).split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=dObj(s);d.setDate(d.getDate()+n);return ymd(d);}
function daysBetween(a,b){return Math.round((dObj(b)-dObj(a))/864e5);}
function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(String(s||""))&&!isNaN(dObj(s).getTime());}
function fmtD(s,yr){return dObj(s).toLocaleDateString(undefined,yr?{weekday:"short",month:"short",day:"numeric",year:"numeric"}:{weekday:"short",month:"short",day:"numeric"});}
function fmtShort(s){return dObj(s).toLocaleDateString(undefined,{month:"short",day:"numeric"});}
function num(v){if(v==null)return null;var n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null;}
function intOrNull(v){var n=parseInt(String(v==null?"":v),10);return isFinite(n)&&n>0?n:null;}
function fmtW(w){return w==null?"—":String(Math.round(w*10)/10);}
function clone(o){return JSON.parse(JSON.stringify(o));}

/* ================= exercise names ================= */
var ALIASES={
  "triceps extension":"Tricep extension","tricep extension":"Tricep extension",
  "inner hips":"Hip adductor (inner)","hips/inner":"Hip adductor (inner)",
  "hips/outer":"Hip abductor (outer)","outer hips":"Hip abductor (outer)",
  "mts row (ea. side)":"MTS row (ea. side)","converging chest supported row (mts, ea. side)":"MTS row (ea. side)",
  "hammer biceps (ea. side)":"Hammer biceps","incline dumbbell curl (ea. side)":"Incline dumbbell curl",
  "triceps press narrow grip":"Triceps press","incline press mts (ea. side)":"Incline press (ea. side)",
  "chest dips":"Assisted dip","lateral raise":"Lateral raise (ea. side)","biceps curl":"Biceps curl machine"
};
function canon(n){
  n=String(n==null?"":n).replace(/\s+/g," ").trim();
  if(!n) return "";
  if(ALIASES[n.toLowerCase()]) return ALIASES[n.toLowerCase()];
  var hit=libNames().filter(function(x){return x.toLowerCase()===n.toLowerCase();})[0];
  return hit||(n.charAt(0).toUpperCase()+n.slice(1));
}

/* ================= default program ================= */
var ORDER=["chestA","backA","legsA","chestB","backB","legsB"];
function I(name,sets,flags){flags=flags||"";return {id:uid(),name:name,sets:sets,core:flags.indexOf("c")>=0,optional:flags.indexOf("o")>=0};}
function defaultProgram(){return {
  chestA:{label:"Chest + Triceps — A",group:"Chest",items:[I("Chest press",5),I("Incline press (ea. side)",4),I("Pec fly",4),I("Lying pullover",3),I("Assisted dip",3),I("Single arm tricep pulldown (ea. side)",3),I("Overhead tricep",3),I("Tricep extension",3),I("Lateral raise (ea. side)",2),I("Abs crunch",3,"c"),I("Hanging leg raises",3,"c")]},
  backA:{label:"Back + Shoulders — A",group:"Back",items:[I("Lat pulldown wide grip",4),I("Rowing",4),I("MTS row (ea. side)",3),I("Assisted pullup",3),I("Shoulder press",4),I("Lateral raise (ea. side)",4),I("Rear delt",3),I("Back extension",4)]},
  legsA:{label:"Legs + Biceps — A",group:"Legs",items:[I("Leg press",4),I("Leg extension",4),I("Seated leg curl",3),I("Seated calf raise",4),I("Hip abductor (outer)",4),I("Hip adductor (inner)",3),I("Biceps curl machine",3),I("Hammer biceps",3),I("Dependent curl",3)]},
  chestB:{label:"Chest + Triceps — B",group:"Chest",items:[I("Chest press",4),I("Incline smith press",4),I("Pec fly",4),I("Assisted dip",3),I("Triceps rope",3),I("Overhead tricep",3),I("Lateral raise (ea. side)",2),I("Lying pullover",3,"o"),I("Rotary torso",3,"c"),I("Abs crunch",3,"c")]},
  backB:{label:"Back + Shoulders — B",group:"Back",items:[I("Lat pulldown close group",4),I("Seated row machine",4),I("MTS row (ea. side)",3),I("One arm row",4),I("MTS front pulldown (ea. side)",3),I("Seated dumbbell shoulder press (ea. side)",4),I("Lateral raise (ea. side)",3),I("Face pulls",3)]},
  legsB:{label:"Legs + Biceps — B",group:"Legs",items:[I("Hack squat",4),I("Leg extension",4),I("Seated leg curl",3),I("Seated calf raise",4),I("Hip abductor (outer)",3),I("Incline dumbbell curl",3),I("Cable curl bicep",3),I("Biceps curl machine",3)]}
};}
var COMPOUND=/chest press|incline press|smith|pulldown|rowing|row machine|mts row|one arm row|shoulder press|leg press|hack squat|bulgarian|pullup|dip/i;
var BIGJUMP=/leg press|hack squat|calf/i;
var CORE=/abs|crunch|leg raise|rotary|plank|dead bug|bird dog/i;
function defaultMeta(name){
  var m={lo:10,hi:15,inc:5,assisted:/assisted/i.test(name)};
  if(COMPOUND.test(name)){m.lo=8;m.hi=12;}
  if(/pullup/i.test(name)){m.lo=6;m.hi=10;}
  if(/calf/i.test(name)){m.lo=12;m.hi=20;}
  if(CORE.test(name)){m.lo=12;m.hi=20;}
  if(BIGJUMP.test(name)) m.inc=10;
  if(/single arm tricep/i.test(name)) m.inc=2.5;
  if(/hanging leg raise|plank/i.test(name)) m.inc=0;
  return m;
}

/* ================= store ================= */
function migrateV1(arr){
  var out=[];
  (Array.isArray(arr)?arr:[]).forEach(function(s){
    if(!s||!validDate(s.date)) return;
    var exs=[];
    (s.exercises||[]).forEach(function(e){
      var name=String(e&&e.name||"").replace(/\s+/g," ").trim(); if(!name) return;
      name=ALIASES[name.toLowerCase()]||name;
      var w=num(e.weight), r=intOrNull(e.reps), n;
      if(e.sets===""||e.sets==null){ if(!w&&!r) return; n=1; }
      else { n=intOrNull(e.sets); if(!n) return; }
      var sets=[]; for(var i=0;i<Math.min(n,12);i++) sets.push({w:w,r:r});
      exs.push({name:name,sets:sets});
    });
    if(exs.length) out.push({id:String(s.id||uid()),date:s.date,dayId:s.rotationId||null,label:String(s.label||""),exercises:exs});
  });
  return out;
}
function freshStore(){return {v:2,rev:PROGRAM_REV,sessions:[],program:defaultProgram(),meta:{},body:[],seenIntro:false};}
function readStore(){
  var raw=lsGet(K2);
  if(raw){try{var s=JSON.parse(raw);if(s&&s.v===2&&Array.isArray(s.sessions))return s;}catch(e){}}
  var st=freshStore();
  var r1=lsGet(K1);
  if(r1){try{st.sessions=migrateV1(JSON.parse(r1));st.migrated=st.sessions.length;}catch(e){}}
  if(st.migrated) st.body=[{date:"2026-11-11",kg:81}];
  return st;
}
/* make any stored shape safe and current; idempotent */
function normalize(st){
  if(!st.body||!Array.isArray(st.body)) st.body=[];
  if(!st.meta||typeof st.meta!=="object") st.meta={};
  if(!st.program||typeof st.program!=="object") st.program=defaultProgram();
  var dp=defaultProgram();
  ORDER.forEach(function(id){ if(!st.program[id]||!Array.isArray(st.program[id].items)) st.program[id]=dp[id]; });
  var alias=function(n){n=String(n||"").replace(/\s+/g," ").trim();return ALIASES[n.toLowerCase()]||n;};
  st.sessions=(st.sessions||[]).filter(function(s){return s&&validDate(s.date)&&Array.isArray(s.exercises);});
  st.sessions.forEach(function(s){
    if(!s.id) s.id=uid();
    var merged=[],byName={};
    s.exercises.forEach(function(e){
      var n=alias(e.name); if(!n) return;
      var sets=(e.sets||[]).filter(Boolean).map(function(x){return{w:num(x.w),r:intOrNull(x.r)};});
      if(!sets.length) return;
      if(byName[n]) byName[n].sets=byName[n].sets.concat(sets); else {byName[n]={name:n,sets:sets};merged.push(byName[n]);}
    });
    s.exercises=merged;
  });
  st.sessions=st.sessions.filter(function(s){return s.exercises.length;});
  ORDER.forEach(function(id){
    var seen={};
    st.program[id].items=st.program[id].items.filter(function(it){
      if(!it) return false; it.name=alias(it.name); if(!it.name||seen[it.name]) return false; seen[it.name]=1;
      if(!it.id) it.id=uid(); it.sets=Math.max(1,Math.min(8,parseInt(it.sets,10)||3)); it.core=!!it.core; it.optional=!!it.optional; return true;
    });
  });
  Object.keys(st.meta).forEach(function(k){var c=alias(k);if(c!==k){if(!st.meta[c])st.meta[c]=st.meta[k];delete st.meta[k];}});
  st.body=st.body.filter(function(b){return b&&validDate(b.date)&&num(b.kg);});
  /* program revisions: targeted edits that keep the user's own changes */
  if(!st.rev||st.rev<2){
    var cb=st.program.chestB.items;
    var names=cb.map(function(x){return x.name;});
    var si=names.indexOf("Smith machine");
    if(si>=0&&names.indexOf("Incline smith press")<0) cb[si].name="Incline smith press";

/* ================= analysis ================= */
var _lib=null;
function libNames(){
  if(_lib) return _lib;
  var c={};
  (S&&S.sessions||[]).forEach(function(x){x.exercises.forEach(function(e){c[e.name]=(c[e.name]||0)+1;});});
  if(S&&S.program) ORDER.forEach(function(id){S.program[id].items.forEach(function(it){if(!c[it.name])c[it.name]=0;});});
  _lib=Object.keys(c).sort(); _lib.counts=c; return _lib;
}
function invalidateLib(){_lib=null;}
function entries(name,excludeId){
  var out=[];
  S.sessions.forEach(function(s){ if(s.id===excludeId) return; s.exercises.forEach(function(e){ if(e.name===name) out.push({date:s.date,sets:e.sets,sid:s.id}); }); });
  return out.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
}
function topW(sets){var m=null;sets.forEach(function(x){if(x.w!=null&&(m==null||x.w>m))m=x.w;});return m;}
function minW(sets){var m=null;sets.forEach(function(x){if(x.w!=null&&(m==null||x.w<m))m=x.w;});return m;}
function workW(name,sets){return meta(name).assisted?minW(sets):topW(sets);}
function repsAt(sets,w){return sets.filter(function(x){return x.w===w;}).map(function(x){return x.r;});}
function bestReps(sets){var m=0;sets.forEach(function(x){if(x.r>m)m=x.r;});return m;}
function setSummary(sets){
  if(!sets.length) return "—";
  var allSame=sets.every(function(x){return x.w===sets[0].w&&x.r===sets[0].r;});
  if(allSame) return sets.length+"×"+(sets[0].r==null?"?":sets[0].r)+" @ "+fmtW(sets[0].w);
  var groups=[],cur=null;
  sets.forEach(function(x){ if(cur&&cur.w===x.w){cur.r.push(x.r==null?"?":x.r);} else {cur={w:x.w,r:[x.r==null?"?":x.r]};groups.push(cur);} });
  return groups.map(function(g){return fmtW(g.w)+"×"+g.r.join(",");}).join(" · ");
}
function stallInfo(name,h){
  h=h||entries(name);
  if(h.length<3) return null;
  var last=h[h.length-1], w=workW(name,last.sets), br=bestReps(last.sets), n=1, first=last.date;
  if(w==null) return null;
  for(var i=h.length-2;i>=0;i--){ var e=h[i]; if(workW(name,e.sets)===w && bestReps(e.sets)>=br){n++;first=e.date;} else break; }
  var weeks=Math.round(daysBetween(first,last.date)/7);
  return (n>=3&&weeks>=3)?{sessions:n,weeks:weeks,w:w}:null;
}
function target(name,excludeId){
  var m=meta(name), h=entries(name,excludeId);
  if(!h.length) return {kind:"new",w:null,reps:m.lo,text:"First time logging this. Pick a weight you can do for "+m.lo+"–"+m.hi+" clean reps with 1–2 left in the tank. That becomes your baseline."};
  var last=h[h.length-1], w=workW(name,last.sets), stuck=stallInfo(name,h);
  var reps=repsAt(last.sets,w).filter(function(r){return r!=null;});
  if(w==null) return {kind:"hold",w:null,reps:m.lo,last:last,text:"No weight logged last time. Enter what you use today."};
  if(!reps.length) return {kind:"hold",w:w,reps:m.lo,last:last,text:"Last time: "+fmtW(w)+" with no reps logged. Do "+fmtW(w)+" and log every set so I can coach the next jump."};
  var minR=Math.min.apply(null,reps);
  var hit=minR>=m.hi && reps.length>=Math.max(1,last.sets.length-1);
  if(hit && m.inc>0){
    var nw=m.assisted?Math.max(0,w-m.inc):w+m.inc;
    var t=(m.assisted?"Every set hit "+m.hi+" with "+fmtW(w)+" assistance. Drop to "+fmtW(nw)+" today":"Every set hit "+m.hi+" at "+fmtW(w)+". Go to "+fmtW(nw)+" today")+" and aim for "+m.lo+"+ reps. When all sets reach "+m.hi+" again, it goes up again.";
    if(stuck&&stuck.sessions>=4) t="You've done "+fmtW(w)+" for "+stuck.sessions+" sessions ("+stuck.weeks+" weeks). Your reps say you've outgrown it. "+(m.assisted?"Take "+fmtW(nw)+" assistance":"Load "+fmtW(nw))+" and accept "+m.lo+"–"+(m.lo+2)+" reps. That's the progress.";
    return {kind:"up",w:nw,reps:m.lo,last:last,stuck:stuck,text:t};
  }
  if(hit) return {kind:"reps",w:w,reps:m.hi+2,last:last,stuck:stuck,text:"You hit "+m.hi+" on every set. Go for "+(m.hi+2)+", or slow the lowering to 3 seconds."};
  var aim=Math.min(m.hi,minR+1);
  var t2="Stay at "+fmtW(w)+". Your lowest set last time was "+minR+". Beat it: aim for "+aim+" on every set, last set 1 rep short of failure.";
  if(stuck&&stuck.sessions>=4) t2="Stuck at "+fmtW(w)+" × "+minR+" for "+stuck.sessions+" sessions. Today: same weight, 3-second lowering on every rep, last set to failure. Next time try "+fmtW(m.assisted?w-m.inc:w+m.inc)+".";
  return {kind:"reps",w:w,reps:aim,last:last,stuck:stuck,text:t2};
}

function sgBox(ctx,placeholder){

function sgMatches(q,exclude){
  var lib=libNames(), counts=lib.counts||{}, ql=q.toLowerCase().trim(), toks=ql.split(/\s+/).filter(Boolean);
  var list=lib.filter(function(n){if(exclude&&exclude.indexOf(n)>=0)return false;var nl=n.toLowerCase();return toks.every(function(t){return nl.indexOf(t)>=0;});});
  list.sort(function(a,b){var as=a.toLowerCase().indexOf(ql)===0?0:1,bs=b.toLowerCase().indexOf(ql)===0?0:1;if(as!==bs)return as-bs;var d=(counts[b]||0)-(counts[a]||0);return d||a.localeCompare(b);});
  return list.slice(0,8);
}
function sgRender(input){

}

function coachIntro(){
  var lines=[], n=sessionsThisWeek(), wd=(new Date().getDay()+6)%7, daysLeft=6-wd;
  var nid=nextDayId(), day=S.program[nid], last=lastOfDay(nid), latest=S.sessions.filter(function(s){return s.date<=todayStr();})[0];
  if(latest){var gap=daysBetween(latest.date,todayStr());
    if(gap===0) lines.push("You already trained today. A second session is fine for a different muscle group, otherwise rest and walk.");
    else if(gap>=4) lines.push("It's been "+gap+" days since your last session. No catching up needed: pick up the cycle where you left it.");}
  lines.push("Next up is <b>"+esc(day.label)+"</b>"+(last?", last done "+Math.max(0,daysBetween(last.date,todayStr()))+" days ago.":"."));
  var ups=[],stuck=[];
  day.items.forEach(function(it){var t=target(it.name);if(t.kind==="up")ups.push(it.name+" → "+fmtW(t.w));if(t.stuck&&t.stuck.sessions>=4)stuck.push(it.name);});
  if(ups.length) lines.push("Ready to go up today:<ul>"+ups.slice(0,6).map(function(u){return"<li>"+esc(u)+"</li>";}).join("")+"</ul>");
  if(stuck.length) lines.push("Flat for a month or more: "+esc(stuck.join(", "))+". These get the hardest push today.");
  var need=6-n;
  if(need<=0) lines.push("Six sessions this week. Take a rest day: that's when the muscle is built.");
  else if(need>daysLeft+1) lines.push("This week: "+n+" so far. Six is out of reach, so make the remaining ones count rather than rushing.");
  else lines.push("This week: "+n+"/6. "+need+" to go.");
  return lines;
}
function coachBody(){
  var b=S.body.slice().sort(function(a,c){return a.date<c.date?-1:1;});
  if(!b.length) return "Log your weight once a week, same morning, before food. I'll tell you if you're losing at the right speed to keep the muscle.";
  var last=b[b.length-1], prev=null;
  for(var i=b.length-2;i>=0;i--){if(daysBetween(b[i].date,last.date)>=6){prev=b[i];break;}}
  var txt="Latest: <b>"+fmtW(last.kg)+" kg</b> ("+fmtShort(last.date)+").";
  if(prev){var weeks=daysBetween(prev.date,last.date)/7, rate=(prev.kg-last.kg)/weeks, rs=Math.round(rate*100)/100, pct=rate/last.kg*100;
    if(rate<=0.05) txt+=" Flat or up "+Math.abs(rs)+" kg/week. If your lifts are climbing that can be muscle, but for fat loss tighten the deficit a little.";
    else if(pct>1) txt+=" Down "+rs+" kg/week. That's fast enough to cost muscle. Eat 200–300 kcal more and keep protein high.";
    else txt+=" Down "+rs+" kg/week. The right pace to lose fat and keep building.";}

  document.getElementById("timerText").textContent=left?("Rest "+m+":"+pad(s)):"Go — next set";
  document.getElementById("timerBar").style.width=(timer.total?left/timer.total*100:0)+"%";
  if(!left){clearInterval(timer.iv);try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}var tok=timer.tok;setTimeout(function(){if(tok===timer.tok)stopRest();},4000);}

function finishSession(){

    if(!sets.length) return; var n=canon(e.name);

  });
  if(!exs.length){toast("Tick at least one set first",true);return;}
  var sess={id:d.id,date:validDate(d.date)?d.date:todayStr(),dayId:d.dayId,label:d.label,exercises:exs};

function buildSummary(sess){
  var ups=[],downs=[],prs=[],total=sessionSets(sess);
  sess.exercises.forEach(function(e){
    var h=entries(e.name,sess.id).filter(function(x){return x.date<=sess.date;}), m=meta(e.name), w=workW(e.name,e.sets);
    if(!h.length||w==null) return;
    var lw=workW(e.name,h[h.length-1].sets), best=null;
    h.forEach(function(x){var v=workW(e.name,x.sets);if(v!=null&&(best==null||(m.assisted?v<best:v>best)))best=v;});
    if(lw==null) return;
    var better=m.assisted?w<lw:w>lw, worse=m.assisted?w>lw:w<lw;
    if(better) ups.push(e.name+" "+(m.assisted?"−":"+")+fmtW(Math.abs(w-lw)));
    else if(worse) downs.push(e.name);
    else {var rn=bestReps(e.sets),rt=bestReps(h[h.length-1].sets);if(rn>rt)ups.push(e.name+" +"+(rn-rt)+" reps");}
    if(best!=null&&(m.assisted?w<best:w>best)) prs.push(e.name);
  });
  var lines=[sess.label+" · "+fmtD(sess.date),total+" sets · ~"+kcal(total)+" kcal (rough)"];
  sess.exercises.forEach(function(e){lines.push("- "+e.name+": "+setSummary(e.sets));});
  if(ups.length) lines.push("Up vs last: "+ups.join(", "));
  var c=[];
  if(prs.length) c.push("New best on "+prs.join(", ")+". Strength going up in a deficit means you're keeping muscle.");
  else if(ups.length) c.push(ups.length+" lift"+(ups.length>1?"s":"")+" moved up today. That's what a good session looks like.");
  else c.push("Nothing moved up today. One flat day is normal. Two in a row on the same lift means sleep, food or the weight choice needs a look.");
  if(downs.length) c.push("Lighter than last time on "+downs.join(", ")+". Fine if deliberate. Next time go back to your previous weight.");
  if(total>40) c.push(total+" sets is a big day. Great if you still feel good tonight. If you get drained or wake up with a low, trim the last accessory next time, not the main lifts.");
  else if(total<16) c.push("A short one. Still counts.");
  c.push("Next: 35–50 g protein in the next few hours. If your glucose is drifting, deal with that first.");
  return {text:lines.join("\n"),coach:c};
}

function lineChart(series){

  var path=series.map(function(p,i){return(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.w).toFixed(1);}).join(" ");
  var dots=series.map(function(p,i){return'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.w).toFixed(1)+'" r="3.5" fill="#0E1116" stroke="#F5A524" stroke-width="2"/>';}).join("");

  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Trend chart">'+g+'<path d="'+path+'" fill="none" stroke="#F5A524" stroke-width="2.5"/>'+dots+lab+'</svg>';

  } else if(ctx.indexOf("swap:")===0){

    state.swap=null; saveDraft(); document.activeElement&&document.activeElement.blur&&document.activeElement.blur(); refreshCard(k); toast("Swapped to "+name);
  } else if(ctx==="plan"){
    var day=S.program[state.planDay];

  rmset:function(b){var e=findEx(b.dataset.k);if(!e||e.sets.length<2)return;e.sets.pop();saveDraft();refreshCard(e.k);},
  rmex:function(b,prev){var k=b.dataset.k;if(prev==="rmex:"+k){state.draft.exercises=state.draft.exercises.filter(function(x){return x.k!==k;});if(state.swap===k)state.swap=null;saveDraft();render();}else arm(b,"rmex:"+k,"Remove?");},
  swapToggle:function(b){var k=b.dataset.k;state.swap=state.swap===k?null:k;refreshCard(k);if(state.swap){var i=main.querySelector('[data-sg="swap:'+k+'"]');if(i){i.focus();sgRender(i);}}},
  sgpick:function(b){pickSuggestion(b.dataset.ctx,b.dataset.val,b.dataset.new==="1");},
  discard:function(b,prev){if(prev==="discard"){var wasEdit=state.draft&&state.draft.editing;state.draft=null;state.swap=null;saveDraft();stopRest();render({top:true});toast(wasEdit?"Edit cancelled":"Workout discarded");}else arm(b,"discard",state.draft.editing?"Tap again to cancel edit":"Tap again to discard");},
  finish:function(){finishSession();},
  copySum:function(){copyText(state.summary.text);},
  closeSum:function(){state.summary=null;render({top:true});},
  timerSkip:function(){stopRest();},
  hf:function(b){state.histFilter=b.dataset.arg;render();},
  hopen:function(b){state.histOpen[b.dataset.arg]=!state.histOpen[b.dataset.arg];render();},
  hedit:function(b){editSession(b.dataset.arg);},
  hcopy:function(b){var s=S.sessions.filter(function(x){return x.id===b.dataset.arg;})[0];if(!s)return;var n=sessionSets(s);copyText([s.label+" · "+fmtD(s.date),n+" sets · ~"+kcal(n)+" kcal (rough)"].concat(s.exercises.map(function(e){return"- "+e.name+": "+setSummary(e.sets);})).join("\n"));},
  hdel:function(b,prev){var id=b.dataset.arg;if(prev==="del:"+id){S.sessions=S.sessions.filter(function(x){return x.id!==id;});delete state.histOpen[id];save();render();toast("Session deleted");}else arm(b,"del:"+id,"Tap again to delete");},
  pd:function(b){state.planDay=b.dataset.arg;render();},
  popen:function(b){state.planOpen[b.dataset.arg]=!state.planOpen[b.dataset.arg];render();},
  pset:function(b){var p=planItem(b.dataset.arg);if(!p.it)return;p.it.sets=Math.max(1,Math.min(8,p.it.sets+(+b.dataset.d)));save();render();},
  pup:function(b){var p=planItem(b.dataset.arg),items=S.program[state.planDay].items;if(p.idx>0){items.splice(p.idx,1);items.splice(p.idx-1,0,p.it);save();render();}},
  prm:function(b,prev){var id=b.dataset.arg;if(prev==="prm:"+id){var items=S.program[state.planDay].items;S.program[state.planDay].items=items.filter(function(x){return x.id!==id;});save();render();toast("Removed from plan");}else arm(b,"prm:"+id,"Sure?");},
  export:function(){exportBackup();},
  import:function(){document.getElementById("importFile").click();},
  resetPlan:function(b,prev){if(prev==="reset"){S.program=defaultProgram();S.rev=PROGRAM_REV;save();state.planOpen={};render();toast("Plan reset");}else arm(b,"reset","Tap again to reset");}
};
document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-act]"); if(!b||b.disabled) return;
  var act=b.dataset.act, prev=state.confirm, pb=state.confirmBtn;
  state.confirm=null; state.confirmBtn=null;
  if(pb&&pb.el!==b){ if(document.body.contains(pb.el)) pb.el.textContent=pb.txt; prev=null; }
  if(ACTIONS[act]){ev.preventDefault();ACTIONS[act](b,prev);}
});
document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.dataset.sg!=null){sgRender(t);return;}
  var key=t.dataset.w||t.dataset.r; if(!key||!state.draft) return;
  var p=key.split(":"), e=findEx(p[0]), j=+p[1]; if(!e||!e.sets[j]) return;
  if(t.dataset.w){e.sets[j].w=t.value;
    for(var i=j+1;i<e.sets.length;i++){if(e.sets[i].done)continue;e.sets[i].w=t.value;var o=main.querySelector('[data-w="'+e.k+':'+i+'"]');if(o)o.value=t.value;}}
  else e.sets[j].r=t.value;
  saveDraft();
});
document.addEventListener("focusin",function(ev){var t=ev.target;if(t.dataset&&t.dataset.sg!=null)sgRender(t);});
document.addEventListener("keydown",function(ev){var t=ev.target;if(ev.key==="Enter"&&t.dataset&&t.dataset.sg!=null){var first=document.querySelector('[data-sglist="'+cssEsc(t.dataset.sg)+'"] .sg-opt');if(first){ev.preventDefault();first.click();}}});
document.addEventListener("change",function(ev){
  var t=ev.target;
  if(t.dataset.actInput==="date"&&state.draft){if(validDate(t.value)){state.draft.date=t.value;saveDraft();}else t.value=state.draft.date;return;}
  if(t.dataset.actInput==="prog"){state.prog=t.value;render();return;}
  if(t.dataset.meta){var name=t.dataset.name,m=Object.assign({},S.meta[name]||{}),cur=meta(name);
    if(t.dataset.meta==="assisted") m.assisted=t.checked;
    else if(t.dataset.meta==="inc"){var v=num(t.value);m.inc=v==null||v<0?cur.inc:Math.min(v,100);}
    else {var iv=intOrNull(t.value);if(!iv){render();return;}m[t.dataset.meta]=Math.min(iv,50);
      var lo=m.lo!=null?m.lo:cur.lo, hi=m.hi!=null?m.hi:cur.hi; if(lo>hi){if(t.dataset.meta==="lo")m.hi=lo;else m.lo=hi;}}
    S.meta[name]=m;save();render();return;}
  if(t.dataset.flag){var p=planItem(t.dataset.arg);if(p.it){p.it[t.dataset.flag]=t.checked;save();render();}}
});
/* close suggestion lists when tapping elsewhere */
document.addEventListener("pointerdown",function(ev){if(ev.target.closest(".sg"))return;document.querySelectorAll(".sg-list").forEach(function(l){l.innerHTML="";});});

/* ================= backup ================= */
function exportBackup(){
  var data=JSON.stringify(S,null,2), name="overload-backup-"+todayStr()+".json";
  try{var blob=new Blob([data],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);toast("Backup ready. Save it to Files.");}
  catch(e){toast("Export failed",true);}
}
document.getElementById("importFile").addEventListener("change",function(e){
  var f=e.target.files&&e.target.files[0]; if(!f) return; var rd=new FileReader();
  rd.onload=function(){
    try{var j=JSON.parse(rd.result),next;
      if(Array.isArray(j)){next=freshStore();next.sessions=migrateV1(j);}
      else if(j&&j.v===2&&Array.isArray(j.sessions)){next=j;}
      else throw new Error("shape");
      next=normalize(next); if(!next.sessions.length){e.target.value="";toast("That backup has no sessions, so nothing was changed",true);return;}
      S=next; save(); state.draft=null; saveDraft(); state.summary=null; render({top:true}); toast("Imported "+S.sessions.length+" sessions");
    }catch(err){toast("That file isn't an Overload backup",true);}
    e.target.value="";
  };
  rd.onerror=function(){toast("Couldn't read that file",true);e.target.value="";};
  rd.readAsText(f);
});

/* ================= go ================= */
if(state.draft){state.tab="today";saveDraft();}
render({top:true});
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
