<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Overload" />
<meta name="theme-color" content="#0E1116" />
<title>Overload</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1116; --panel:#171B22; --panel2:#1E242D; --line:#2A313B;
  --text:#E6EAF0; --dim:#8A94A3; --faint:#4A5260;
  --accent:#F5A524; --accentInk:#1a1205; --up:#4ADE80; --upInk:#062012; --warn:#F87171;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--bg);}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--text);font-size:15px;line-height:1.45;}
button,input,select{font:inherit;color:inherit;}
.wrap{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom));min-height:100vh;}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.brand{display:flex;align-items:center;gap:10px;}
.mark{color:var(--accent);font-size:22px;line-height:1;}
.head h1{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;letter-spacing:.14em;margin:0;}
.week{display:flex;gap:4px;align-items:center;}
.week i{width:9px;height:22px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);display:block;}
.week i.on{background:var(--accent);border-color:var(--accent);}
.week span{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);margin-left:6px;}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(14,17,22,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));}
.tabs-in{max-width:640px;margin:0 auto;display:flex;gap:6px;}
.tab{flex:1;padding:10px 4px;background:transparent;border:none;color:var(--dim);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;border-radius:9px;cursor:pointer;}
.tab.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line);}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
.h2{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;margin:0 0 4px;}
.eyebrow{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin:0 0 8px;}
.muted{color:var(--dim);font-size:13px;}
.mono{font-family:'JetBrains Mono',monospace;}
.coach{border-color:#3a3020;background:linear-gradient(180deg,#1c1a14,#171B22);}
.coach .who{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.coach .who b{font-family:'Space Grotesk',sans-serif;font-size:12px;letter-spacing:.12em;color:var(--accent);}
.coach p{margin:0 0 8px;}
.coach p:last-child{margin-bottom:0;}
.coach ul{margin:4px 0 8px;padding-left:18px;}
.coach li{margin:2px 0;}
.btn{border:none;border-radius:10px;font-family:'Space Grotesk',sans-serif;font-weight:600;cursor:pointer;padding:12px 14px;font-size:15px;}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.primary{background:var(--accent);color:var(--accentInk);}
.go{background:var(--up);color:var(--upInk);}
.ghost{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line);}
.danger{background:transparent;color:var(--warn);box-shadow:inset 0 0 0 1px #4a2a2a;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.full{width:100%;}
.row{display:flex;gap:8px;align-items:center;}
.row.wrapx{flex-wrap:wrap;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:7px 12px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:20px;font-size:13px;cursor:pointer;}
.chip.on{background:var(--accent);color:var(--accentInk);border-color:var(--accent);font-weight:600;}
.chip.next{border-color:var(--accent);color:var(--text);}
input.in,select.in{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px;font-size:15px;width:100%;}
input.in:focus,select.in:focus{outline:none;border-color:var(--accent);}
.ex{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;margin-bottom:10px;}
.ex.done{border-color:#24533a;}
.ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.ex-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;background:var(--panel2);color:var(--dim);border:1px solid var(--line);margin-right:4px;}
.tag.up{color:var(--up);border-color:#24533a;background:#10221a;}
.tag.stuck{color:var(--accent);border-color:#4a3a1a;background:#221a0e;}
.tip{font-size:13px;color:#cfd5de;margin:6px 0 8px;padding:8px 10px;background:var(--panel2);border-radius:9px;border-left:3px solid var(--accent);}
.tip.up{border-left-color:var(--up);}
.last{font-size:12px;color:var(--dim);margin-top:2px;}
.sets{display:grid;grid-template-columns:22px 1fr 14px 1fr 44px;gap:6px;align-items:center;margin-top:4px;}
.sets .n{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--faint);text-align:center;}
.sets .x{color:var(--faint);text-align:center;font-size:13px;}
.sets input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 6px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:16px;width:100%;}
.sets input:focus{outline:none;border-color:var(--accent);}
.sets input::placeholder{color:var(--faint);}
.chk{height:42px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--faint);font-size:18px;cursor:pointer;}
.chk.on{background:var(--up);border-color:var(--up);color:var(--upInk);}
.mini{background:none;border:none;color:var(--dim);font-size:12px;cursor:pointer;padding:6px 4px;text-transform:uppercase;letter-spacing:.06em;font-family:'Space Grotesk',sans-serif;}
.mini:hover{color:var(--text);}
.mini.red{color:var(--warn);}
.timer{position:fixed;left:0;right:0;top:0;z-index:30;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;background:#10221a;border-bottom:1px solid #24533a;display:none;}
.timer.show{display:block;}
.timer-in{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;color:var(--up);}
.bar{height:3px;background:#24533a;border-radius:2px;margin-top:6px;overflow:hidden;max-width:640px;margin-left:auto;margin-right:auto;}
.bar i{display:block;height:100%;background:var(--up);width:100%;transition:width 1s linear;}
.sticky{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:15;padding:8px 16px;}
.sticky-in{max-width:640px;margin:0 auto;display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px;box-shadow:0 -8px 24px rgba(0,0,0,.4);}
.sticky-in .muted{flex:1;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;padding:6px;border-bottom:1px solid var(--line);font-weight:600;}
td{padding:8px 6px;border-bottom:1px solid rgba(42,49,59,.5);vertical-align:top;}
tr:last-child td{border-bottom:none;}
.d-up{color:var(--up);font-family:'JetBrains Mono',monospace;font-size:12px;}
.d-dn{color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:12px;}
.d-eq{color:var(--faint);font-family:'JetBrains Mono',monospace;font-size:12px;}
.stat3{display:flex;gap:8px;margin:10px 0;}
.stat3>div{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px;text-align:center;}
.stat3 b{display:block;font-family:'JetBrains Mono',monospace;font-size:20px;}
.stat3 span{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(42,49,59,.5);gap:10px;}
.list-item:last-child{border-bottom:none;}
.plan-item{display:grid;grid-template-columns:1fr auto;gap:6px;padding:8px 0;border-bottom:1px solid rgba(42,49,59,.5);}
.plan-item:last-child{border-bottom:none;}
.stepper{display:flex;align-items:center;gap:4px;}
.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;}
.stepper span{min-width:22px;text-align:center;font-family:'JetBrains Mono',monospace;}
.meta-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px;}
.meta-row label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;}
.meta-row input{padding:8px;font-size:14px;}
pre.sum{white-space:pre-wrap;font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--panel2);border-radius:10px;padding:10px;margin:8px 0;color:#cfd5de;}
.empty{color:var(--dim);text-align:center;padding:24px 8px;}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom));background:var(--up);color:var(--upInk);padding:9px 16px;border-radius:20px;font-weight:600;font-size:13px;z-index:40;display:none;}
.toast.show{display:block;}
svg text{font-family:'JetBrains Mono',monospace;}
@media(prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div class="timer" id="timer"><div class="timer-in"><span id="timerText">Rest 1:30</span><button class="mini" id="timerSkip" style="color:var(--up)">Skip</button></div><div class="bar"><i id="timerBar"></i></div></div>
<div class="wrap">
  <header class="head">
    <div class="brand"><span class="mark">▲</span><h1>OVERLOAD</h1></div>
    <div class="week" id="weekStrip" title="Sessions this week"></div>
  </header>
  <main id="main"></main>
</div>
<div class="sticky" id="sticky" style="display:none"></div>
<nav class="tabs"><div class="tabs-in">
  <button class="tab on" data-tab="today">Today</button>
  <button class="tab" data-tab="history">History</button>
  <button class="tab" data-tab="progress">Progress</button>
  <button class="tab" data-tab="plan">Plan</button>
</div></nav>
<div class="toast" id="toast"></div>
<input id="importFile" type="file" accept="application/json,.json" style="display:none" />

<script>
"use strict";
/* ============ storage ============ */
var K1="overload_workouts_v1", K2="overload_v2", KD="overload_draft_v2";
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
var uid=function(){return Math.random().toString(36).slice(2,10);};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});};
function todayStr(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);}
function dObj(s){return new Date(s+"T00:00:00");}
function daysBetween(a,b){return Math.round((dObj(b)-dObj(a))/864e5);}
function fmtD(s,yr){return dObj(s).toLocaleDateString(undefined,yr?{weekday:"short",month:"short",day:"numeric",year:"numeric"}:{weekday:"short",month:"short",day:"numeric"});}
function fmtShort(s){return dObj(s).toLocaleDateString(undefined,{month:"short",day:"numeric"});}
function num(v){var n=parseFloat(v);return isNaN(n)?null:n;}
function fmtW(w){return w==null?"—":(Math.round(w*10)/10).toString();}

/* ============ exercise names ============ */
var ALIASES={
  "triceps extension":"Tricep extension","tricep extension":"Tricep extension",
  "inner hips":"Hip adductor (inner)","hips/inner":"Hip adductor (inner)",
  "hips/outer":"Hip abductor (outer)","outer hips":"Hip abductor (outer)",
  "mts row (ea. side)":"MTS row (ea. side)","converging chest supported row (mts, ea. side)":"MTS row (ea. side)",
  "hammer biceps (ea. side)":"Hammer biceps","incline dumbbell curl (ea. side)":"Incline dumbbell curl",
  "triceps press narrow grip":"Triceps press","incline press mts (ea. side)":"Incline press (ea. side)",
  "chest dips":"Assisted dip"
};
function canon(n){n=String(n||"").trim().replace(/\s+/g," ");return ALIASES[n.toLowerCase()]||n;}

/* ============ default program ============ */
var ORDER=["chestA","backA","legsA","chestB","backB","legsB"];
function I(name,sets,core){return {name:name,sets:sets,core:!!core};}
var DEFAULT_PROGRAM={
  chestA:{label:"Chest + Triceps — A",group:"Chest",items:[I("Chest press",5),I("Incline press (ea. side)",4),I("Pec fly",4),I("Lying pullover",3),I("Assisted dip",3),I("Single arm tricep pulldown (ea. side)",3),I("Overhead tricep",3),I("Tricep extension",3),I("Lateral raise (ea. side)",2),I("Abs crunch",3,1),I("Hanging leg raises",3,1)]},
  backA:{label:"Back + Shoulders — A",group:"Back",items:[I("Lat pulldown wide grip",4),I("Rowing",4),I("MTS row (ea. side)",3),I("Assisted pullup",3),I("Shoulder press",4),I("Lateral raise",4),I("Rear delt",3),I("Back extension",4)]},
  legsA:{label:"Legs + Biceps — A",group:"Legs",items:[I("Leg press",4),I("Leg extension",4),I("Seated leg curl",3),I("Seated calf raise",4),I("Hip abductor (outer)",4),I("Hip adductor (inner)",3),I("Biceps curl machine",3),I("Hammer biceps",3),I("Dependent curl",3)]},
  chestB:{label:"Chest + Triceps — B",group:"Chest",items:[I("Chest press",4),I("Smith machine",4),I("Pec fly",4),I("Lying pullover",3),I("Assisted dip",3),I("Triceps rope",3),I("Overhead tricep",3),I("Single arm tricep pulldown (ea. side)",3),I("Lateral raise (ea. side)",2),I("Rotary torso",3,1),I("Abs crunch",3,1)]},
  backB:{label:"Back + Shoulders — B",group:"Back",items:[I("Lat pulldown close group",4),I("Seated row machine",4),I("MTS row (ea. side)",3),I("One arm row",4),I("MTS front pulldown (ea. side)",3),I("Seated dumbbell shoulder press (ea. side)",4),I("Lateral raise (ea. side)",3),I("Face pulls",3)]},
  legsB:{label:"Legs + Biceps — B",group:"Legs",items:[I("Hack squat",4),I("Leg extension",4),I("Seated leg curl",3),I("Seated calf raise",4),I("Hip abductor (outer)",3),I("Incline dumbbell curl",3),I("Cable curl bicep",3),I("Biceps curl",3)]}
};
var COMPOUND=/chest press|incline press|smith|pulldown|rowing|row machine|mts row|one arm row|shoulder press|leg press|hack squat|bulgarian|pullup|dip/i;
var BIGJUMP=/leg press|hack squat|calf/i;
var CORE=/abs|crunch|leg raise|rotary|plank|dead bug|bird dog/i;
function defaultMeta(name){
  var m={lo:10,hi:15,inc:5,assisted:/assisted/i.test(name)};
  if(COMPOUND.test(name)){m.lo=8;m.hi=12;}
  if(/pullup/i.test(name)){m.lo=6;m.hi=10;}
  if(/calf/i.test(name)){m.lo=12;m.hi=20;}
  if(CORE.test(name)){m.lo=12;m.hi=20;}
  if(BIGJUMP.test(name)) m.inc=10;
  if(/ea\. side|dumbbell|hammer|curl \(|lateral raise \(/i.test(name)&&!BIGJUMP.test(name)) m.inc=5;
  if(/hanging leg raise/i.test(name)) m.inc=0;
  return m;
}

/* ============ migration ============ */
function migrateV1(arr){
  var out=[];
  (arr||[]).forEach(function(s){
    var exs=[];
    (s.exercises||[]).forEach(function(e){
      var name=canon(e.name), w=num(e.weight), r=parseInt(e.reps,10), n;
      if(isNaN(r)||r<=0) r=null;
      if(e.sets===""||e.sets==null){ if(!w&&!r) return; n=1; }
      else { n=parseInt(e.sets,10); if(!n||n<=0) return; }
      var sets=[]; for(var i=0;i<n;i++) sets.push({w:w,r:r});
      exs.push({name:name,sets:sets});
    });
    if(exs.length) out.push({id:s.id||uid(),date:s.date,dayId:s.rotationId||null,label:s.label||"",exercises:exs});
  });
  return out;
}
function freshStore(){return {v:2,sessions:[],program:JSON.parse(JSON.stringify(DEFAULT_PROGRAM)),meta:{},body:[],seenIntro:false};}
function loadStore(){
  var raw=lsGet(K2);
  if(raw){try{var s=JSON.parse(raw);if(s&&s.v===2){if(!s.body)s.body=[];if(!s.meta)s.meta={};if(!s.program)s.program=JSON.parse(JSON.stringify(DEFAULT_PROGRAM));return s;}}catch(e){}}
  var st=freshStore();
  var r1=lsGet(K1);
  if(r1){try{st.sessions=migrateV1(JSON.parse(r1));st.migrated=st.sessions.length;}catch(e){}}
  if(st.migrated) st.body=[{date:"2026-11-11",kg:81}];
  return st;
}
var S=loadStore();
function save(){S.sessions.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0;});lsSet(K2,JSON.stringify(S));}
save();
function meta(name){return Object.assign(defaultMeta(name),S.meta[name]||{});}

/* ============ analysis ============ */
function entries(name,excludeId){
  var out=[];
  S.sessions.forEach(function(s){ if(s.id===excludeId) return; s.exercises.forEach(function(e){ if(e.name===name) out.push({date:s.date,sets:e.sets,sid:s.id}); }); });
  return out.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
}
function topW(sets){var m=null;sets.forEach(function(x){if(x.w!=null&&(m==null||x.w>m))m=x.w;});return m;}
function minW(sets){var m=null;sets.forEach(function(x){if(x.w!=null&&(m==null||x.w<m))m=x.w;});return m;}
function workW(name,sets){return meta(name).assisted?minW(sets):topW(sets);}
function repsAt(sets,w){return sets.filter(function(x){return x.w===w;}).map(function(x){return x.r;});}
function setSummary(sets){
  if(!sets.length) return "—";
  var allSame=sets.every(function(x){return x.w===sets[0].w&&x.r===sets[0].r;});
  if(allSame) return sets.length+"×"+(sets[0].r==null?"?":sets[0].r)+" @ "+fmtW(sets[0].w);
  var groups=[],cur=null;
  sets.forEach(function(x){ if(cur&&cur.w===x.w){cur.r.push(x.r==null?"?":x.r);} else {cur={w:x.w,r:[x.r==null?"?":x.r]};groups.push(cur);} });
  return groups.map(function(g){return fmtW(g.w)+"×"+g.r.join(",");}).join(" · ");
}
function bestReps(sets){var m=0;sets.forEach(function(x){if(x.r>m)m=x.r;});return m;}
/* coaching target for one exercise */
function target(name,excludeId){
  var m=meta(name), h=entries(name,excludeId);
  if(!h.length) return {kind:"new",w:null,reps:m.lo,text:"First time logging this. Pick a weight you can do for "+m.lo+"–"+m.hi+" clean reps and leave 1–2 in the tank."};
  var last=h[h.length-1], w=workW(name,last.sets), reps=repsAt(last.sets,w).filter(function(r){return r!=null;});
  var sinceLast=daysBetween(last.date,todayStr());
  var stuck=stallInfo(name,h);
  if(!reps.length) return {kind:"hold",w:w,reps:m.lo,last:last,text:"Last time: "+fmtW(w)+" with no reps logged. Do "+fmtW(w)+" and log every set so I can coach the next jump."};
  var minR=Math.min.apply(null,reps);
  var hit=minR>=m.hi && reps.length>=Math.max(1,last.sets.length-1);
  if(hit && m.inc>0){
    var nw=m.assisted?Math.max(0,w-m.inc):w+m.inc;
    var t=(m.assisted?"Every set hit "+m.hi+" with "+fmtW(w)+" assistance. Drop to "+fmtW(nw)+" today":"Every set hit "+m.hi+" at "+fmtW(w)+". Go to "+fmtW(nw)+" today")+" and aim for "+m.lo+"+ reps. When all sets reach "+m.hi+" again, it goes up again.";
    if(stuck&&stuck.sessions>=4) t="You've done "+fmtW(w)+" for "+stuck.sessions+" sessions ("+stuck.weeks+" weeks) without changing anything. Your reps say you've outgrown it. "+(m.assisted?"Take "+fmtW(nw)+" assistance":"Load "+fmtW(nw))+" and accept "+m.lo+"–"+(m.lo+2)+" reps. That's the progress.";
    return {kind:"up",w:nw,reps:m.lo,last:last,stuck:stuck,text:t};
  }
  if(hit && m.inc===0) return {kind:"reps",w:w,reps:m.hi+2,last:last,text:"Bodyweight. You hit "+m.hi+" on every set. Go for "+(m.hi+2)+", or slow the lowering to 3 seconds."};
  var aim=Math.min(m.hi,minR+1);
  var t2="Stay at "+fmtW(w)+". Last time your lowest set was "+minR+". Beat it: aim for "+aim+" on every set. Push the last set to 1 rep short of failure.";
  if(stuck&&stuck.sessions>=4) t2="Stuck at "+fmtW(w)+" × "+minR+" for "+stuck.sessions+" sessions. Today: same weight, 3-second lowering on every rep, and take the last set to failure. Next time try "+fmtW(m.assisted?w-m.inc:w+m.inc)+".";
  return {kind:"reps",w:w,reps:aim,last:last,stuck:stuck,text:t2};
}
function stallInfo(name,h){
  h=h||entries(name);
  if(h.length<3) return null;
  var last=h[h.length-1], w=workW(name,last.sets), br=bestReps(last.sets), n=1, first=last.date;
  for(var i=h.length-2;i>=0;i--){ var e=h[i]; if(workW(name,e.sets)===w && bestReps(e.sets)>=br){n++;first=e.date;} else break; }
  var weeks=Math.round(daysBetween(first,last.date)/7);

  return null;
}
function sessionSets(s){var n=0;s.exercises.forEach(function(e){n+=e.sets.length;});return n;}
function kcal(sets){return Math.round((100+6.5*sets)/5)*5;}
function weekStart(dstr){var d=dObj(dstr);var wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return d.toISOString().slice(0,10);}
function sessionsThisWeek(){var ws=weekStart(todayStr());return S.sessions.filter(function(s){return s.date>=ws&&s.date<=todayStr();}).length;}
function lastDayed(){for(var i=0;i<S.sessions.length;i++){if(S.sessions[i].dayId&&S.program[S.sessions[i].dayId])return S.sessions[i];}return null;}
function nextDayId(){var l=lastDayed();if(!l)return ORDER[0];var i=ORDER.indexOf(l.dayId);return ORDER[(i+1)%ORDER.length];}
function lastOfDay(dayId){for(var i=0;i<S.sessions.length;i++)if(S.sessions[i].dayId===dayId)return S.sessions[i];return null;}
function weeklyCounts(n){
  var out=[],ws=weekStart(todayStr());
  for(var i=n-1;i>=0;i--){var d=dObj(ws);d.setDate(d.getDate()-7*i);var a=d.toISOString().slice(0,10);var e=new Date(d);e.setDate(e.getDate()+6);var b=e.toISOString().slice(0,10);
    out.push({start:a,count:S.sessions.filter(function(s){return s.date>=a&&s.date<=b;}).length});}
  return out;
}

function coachIntro(){
  var lines=[], n=sessionsThisWeek(), wd=(new Date().getDay()+6)%7, daysLeft=6-wd;
  var nid=nextDayId(), day=S.program[nid], last=lastOfDay(nid);
  var anySession=S.sessions[0];
  if(anySession){
    var gap=daysBetween(anySession.date,todayStr());
    if(gap===0) lines.push("You already trained today. Another session is fine if it's a different muscle group, otherwise rest and walk.");
    else if(gap>=4) lines.push("It's been "+gap+" days since your last session. No catching up: just pick up the cycle where you left it.");
  }
  lines.push("Next up is <b>"+esc(day.label)+"</b>"+(last?", last done "+daysBetween(last.date,todayStr())+" days ago.":"."));
  var ups=[],stuck=[];
  day.items.forEach(function(it){var t=target(it.name);if(t.kind==="up")ups.push(it.name+" → "+fmtW(t.w));if(t.stuck&&t.stuck.sessions>=4)stuck.push(it.name);});
  if(ups.length) lines.push("Ready to go up today:<ul>"+ups.slice(0,6).map(function(u){return"<li>"+esc(u)+"</li>";}).join("")+"</ul>");
  if(stuck.length) lines.push("Flat for a month or more: "+esc(stuck.join(", "))+". These get the heaviest push today.");
  var need=6-n;

  else if(need>0) lines.push("This week: "+n+"/6. "+need+" to go.");

}
function coachBody(){
  var b=S.body.slice().sort(function(a,c){return a.date<c.date?-1:1;});
  if(!b.length) return "Log your weight once a week (same morning, before food). I'll tell you if you're losing at the right speed to keep the muscle.";
  var last=b[b.length-1];
  var prev=null; for(var i=b.length-2;i>=0;i--){ if(daysBetween(b[i].date,last.date)>=6){prev=b[i];break;} }
  var txt="Latest: <b>"+last.kg+" kg</b> ("+fmtShort(last.date)+").";
  if(prev){
    var weeks=daysBetween(prev.date,last.date)/7, rate=(prev.kg-last.kg)/weeks, pct=rate/last.kg*100;
    var rs=(Math.round(rate*100)/100);

  var d=state.draft, exs=[];
  d.exercises.forEach(function(e){
    var sets=e.sets.filter(function(x){return x.done;}).map(function(x){var r=parseInt(x.r,10);return{w:num(x.w),r:isNaN(r)?null:r};});
    if(sets.length) exs.push({name:canon(e.name),sets:sets});
  });
  if(!exs.length) return;
  var sess={id:d.id,date:d.date,dayId:d.dayId,label:d.label,exercises:exs};
  var before=S.sessions.filter(function(x){return x.id!==d.id;});
  S.sessions=before.concat([sess]); save();
  state.summary=buildSummary(sess); state.draft=null; saveDraft(); stopRest(); render(); window.scrollTo(0,0);
}
function buildSummary(sess){
  var ups=[],holds=[],downs=[],prs=[],totalSets=sessionSets(sess);
  sess.exercises.forEach(function(e){
    var h=entries(e.name,sess.id).filter(function(x){return x.date<=sess.date;});
    var m=meta(e.name), w=workW(e.name,e.sets);
    if(!h.length){holds.push(e.name+" (new)");return;}
    var lw=workW(e.name,h[h.length-1].sets), best=null;
    h.forEach(function(x){var v=workW(e.name,x.sets);if(v!=null&&(best==null||(m.assisted?v<best:v>best)))best=v;});
    var better=m.assisted?(w<lw):(w>lw), worse=m.assisted?(w>lw):(w<lw);
    if(better){ups.push(e.name+" "+(m.assisted?"−":"+")+fmtW(Math.abs(w-lw)));}
    else if(worse){downs.push(e.name);}
    else{var rNow=bestReps(e.sets),rThen=bestReps(h[h.length-1].sets);if(rNow>rThen)ups.push(e.name+" +"+(rNow-rThen)+" reps");else holds.push(e.name);}
    if(best!=null&&(m.assisted?w<best:w>best)) prs.push(e.name);
  });
  var lines=[];
  lines.push(sess.label+" · "+fmtD(sess.date));
  lines.push(totalSets+" sets · ~"+kcal(totalSets)+" kcal (rough)");
  sess.exercises.forEach(function(e){lines.push("- "+e.name+": "+setSummary(e.sets));});
  if(ups.length) lines.push("Up vs last: "+ups.join(", "));
  var coach=[];
  if(prs.length) coach.push("New best on "+prs.join(", ")+". That's strength going up while you're in a deficit, which means you're holding muscle.");
  else if(ups.length) coach.push(ups.length+" lift"+(ups.length>1?"s":"")+" moved up today. That's how a good session looks.");
  else coach.push("Nothing moved up today. One flat day is normal. Two in a row on the same lift means sleep, food or the weight choice needs a look.");
  if(downs.length) coach.push("Lighter than last time on "+downs.join(", ")+". Fine if it was deliberate or you're tired. Next time go back to your previous weight.");
  if(totalSets>40) coach.push(totalSets+" sets is a big day. Great if you still feel good tonight. If you get drained later or wake up with a low, trim the last accessory next time rather than the main lifts.");
  else if(totalSets<16) coach.push("A short one. Totally fine on a busy day, it still counts.");
  coach.push("Now: protein in the next few hours (35–50 g), and if your glucose is drifting, deal with that first.");
  return {text:lines.join("\n"),coach:coach,sess:sess};
}

function viewProgress(){

  var h='';
  var wk=weeklyCounts(8), avg=Math.round(wk.slice(0,7).reduce(function(a,b){return a+b.count;},0)/7*10)/10;
  h+='<div class="card"><p class="eyebrow">Sessions per week · goal 6</p>'+weekChart(wk)+'<p class="muted" style="margin:6px 0 0">Average over the last 7 full weeks: <b class="mono" style="color:var(--text)">'+avg+'</b>. '+(avg>=5?"Strong consistency.":avg>=4?"Solid. Each muscle still gets trained about once every 5–6 days.":"Below 4 means each lift comes back slowly. Even 4 steady weeks beat 6 one week and 2 the next.")+'</p></div>';
  var planned={}; ORDER.forEach(function(id){S.program[id].items.forEach(function(it){planned[it.name]=1;});});
  var ups=[],stuck=[];
  Object.keys(planned).forEach(function(n){var t=target(n);if(t.kind==="up")ups.push({n:n,w:t.w});var st=stallInfo(n);if(st&&st.sessions>=3)stuck.push({n:n,s:st});});

  h+='<div class="card"><p class="eyebrow">Flat for 3+ weeks</p>'+(stuck.length?stuck.map(function(u){return'<div class="list-item"><span>'+esc(u.n)+'</span><span class="d-dn">'+fmtW(u.s.w)+' · '+u.s.weeks+'w</span></div>';}).join(""):'<p class="muted">Nothing stuck. Nice.</p>')+'</div>';
  var names=libNames().filter(function(n){return entries(n).length>0;});
  if(!state.prog||names.indexOf(state.prog)<0) state.prog=names.indexOf("Chest press")>=0?"Chest press":names[0];
  var series=entries(state.prog).map(function(e){return{date:e.date,w:workW(state.prog,e.sets),sets:e.sets};}).filter(function(p){return p.w!=null;});
  h+='<div class="card"><p class="eyebrow">Exercise history</p><select class="in" id="progSel">'+names.map(function(n){return'<option'+(n===state.prog?" selected":"")+'>'+esc(n)+'</option>';}).join("")+'</select>';
  if(series.length){
    var first=series[0].w,last=series[series.length-1].w,as=meta(state.prog).assisted,ch=Math.round((last-first)*10)/10;
    h+='<div class="stat3"><div><b>'+fmtW(last)+'</b><span>'+(as?"assist now":"working wt")+'</span></div><div><b class="'+((as?ch<0:ch>0)?"d-up":"")+'" style="font-size:20px">'+(ch>0?"+":"")+ch+'</b><span>since start</span></div><div><b>'+series.length+'</b><span>sessions</span></div></div>';
    h+=lineChart(series);
    h+='<table><thead><tr><th>Date</th><th>Sets</th></tr></thead><tbody>'+series.slice().reverse().slice(0,12).map(function(p){return'<tr><td>'+fmtShort(p.date)+'</td><td class="mono" style="font-size:12px">'+setSummary(p.sets)+'</td></tr>';}).join("")+'</tbody></table>';
  }
  h+='</div>';
  h+='<div class="card"><p class="eyebrow">Body weight</p>'+bodyBlock()+'</div>';
  return h;
}
function bodyBlock(){
  var b=S.body.slice().sort(function(a,c){return a.date<c.date?-1:1;});
  if(!b.length) return '<p class="muted">No weigh-ins yet. Log one on the Today tab.</p>';
  var h=b.length>1?lineChart(b.map(function(x){return{date:x.date,w:x.kg};}),"kg"):"";
  h+='<p style="margin:6px 0 0">'+coachBody()+'</p>';
  return h;
}
function lineChart(series,unit){
  var W=560,H=180,pl=38,pr=12,pt=12,pb=26;
  var vals=series.map(function(p){return p.w;}),mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  if(mn===mx){mn-=5;mx+=5;}
  var n=series.length;
  function X(i){return pl+(n<=1?(W-pl-pr)/2:i*(W-pl-pr)/(n-1));}
  function Y(v){return H-pb-(v-mn)/(mx-mn)*(H-pt-pb);}
  var g="";[0,.5,1].forEach(function(f){var v=mn+f*(mx-mn),y=Y(v).toFixed(1);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#242b35"/><text x="2" y="'+(+y+4)+'" fill="#8A94A3" font-size="11">'+(Math.round(v*10)/10)+'</text>';});
  var path=series.map(function(p,i){return(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.w).toFixed(1);}).join(" ");
  var dots=series.map(function(p,i){return'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.w).toFixed(1)+'" r="3.5" fill="#0E1116" stroke="#F5A524" stroke-width="2"/>';}).join("");
  var step=Math.ceil(n/6),lab="";series.forEach(function(p,i){if(i%step&&i!==n-1)return;lab+='<text x="'+X(i).toFixed(1)+'" y="'+(H-6)+'" fill="#8A94A3" font-size="11" text-anchor="middle">'+fmtShort(p.date)+'</text>';});
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Trend chart">'+g+'<path d="'+path+'" fill="none" stroke="#F5A524" stroke-width="2.5"/>'+dots+lab+'</svg>';
}
function weekChart(wk){
  var W=560,H=110,pb=22,bw=(W-20)/wk.length;
  var g='<line x1="0" x2="'+W+'" y1="'+(H-pb-(6/7)*(H-pb-8))+'" y2="'+(H-pb-(6/7)*(H-pb-8))+'" stroke="#4a3a1a" stroke-dasharray="4 4"/>';
  wk.forEach(function(w,i){var h=(Math.min(w.count,7)/7)*(H-pb-8),x=10+i*bw+bw*.2,y=H-pb-h;
    g+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw*.6).toFixed(1)+'" height="'+Math.max(h,1).toFixed(1)+'" rx="3" fill="'+(i===wk.length-1?"#F5A524":"#3a4250")+'"/><text x="'+(x+bw*.3).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" fill="#E6EAF0" font-size="11" text-anchor="middle">'+w.count+'</text><text x="'+(x+bw*.3).toFixed(1)+'" y="'+(H-6)+'" fill="#8A94A3" font-size="10" text-anchor="middle">'+fmtShort(w.start)+'</text>';});
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Sessions per week">'+g+'</svg>';
}

/* ============ plan ============ */
function viewPlan(){
  if(!state.planDay) state.planDay=ORDER[0];
  var d=S.program[state.planDay], tot=0; d.items.forEach(function(it){tot+=it.sets;});
  var h='<div class="card coach"><div class="who"><span class="mark" style="font-size:14px">▲</span><b>HOW THIS PLAN WORKS</b></div><p>Your volume stays where you like it. What changes is the order: the lifts the app tracks for progress come first, while you&rsquo;re fresh, and accessories come after.</p><p>Chest press, pec fly, pullover, dips, overhead tricep, leg extension, leg curl and calves appear in both A and B, so they come back about every 5–6 days even when you miss a day.</p><p>Every exercise has a rep range. Stay at a weight until every set hits the top of the range, then go up. The app tells you when.</p><p>For shape: side delts get trained 4 times a cycle (lateral raises on chest days too) and upper chest gets its own press on A days. Shoulders and V-taper are what change how you look in a shirt most.</p></div>';
  h+='<div class="chips" style="margin-bottom:12px">'+ORDER.map(function(id){return'<button class="chip'+(id===state.planDay?" on":"")+'" data-pd="'+id+'">'+esc(S.program[id].label.replace(/ \+ \w+/,""))+'</button>';}).join("")+'</div>';
  h+='<div class="card"><div class="row" style="justify-content:space-between"><p class="h2">'+esc(d.label)+'</p><span class="muted mono">'+tot+' sets</span></div>';
  d.items.forEach(function(it,i){
    var m=meta(it.name), open=state.planOpen[state.planDay+i];
    h+='<div class="plan-item"><div><div style="font-weight:500;cursor:pointer" data-popen="'+i+'">'+esc(it.name)+(it.core?' <span class="tag">core</span>':'')+'</div><div class="muted" style="font-size:12px">'+m.lo+'–'+m.hi+' reps · +'+m.inc+(m.assisted?" (assist ↓)":"")+'</div></div><div class="row" style="gap:2px"><div class="stepper"><button data-ps="'+i+'" data-d="-1">−</button><span>'+it.sets+'</span><button data-ps="'+i+'" data-d="1">+</button></div><button class="mini" data-pup="'+i+'">↑</button><button class="mini red" data-prm="'+i+'">✕</button></div>';
    if(open) h+='<div style="grid-column:1/-1"><div class="meta-row"><div><label>Min reps</label><input class="in" type="number" data-mlo="'+esc(it.name)+'" value="'+m.lo+'"></div><div><label>Max reps</label><input class="in" type="number" data-mhi="'+esc(it.name)+'" value="'+m.hi+'"></div><div><label>Jump</label><input class="in" type="number" step="2.5" data-minc="'+esc(it.name)+'" value="'+m.inc+'"></div></div><label class="muted" style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" data-mas="'+esc(it.name)+'"'+(m.assisted?" checked":"")+'> Assisted (lower weight = progress)</label></div>';
    h+='</div>';
  });
  h+='<div class="row" style="margin-top:10px"><input class="in" list="libList" id="planAddIn" placeholder="Add exercise"><button class="btn ghost" id="planAdd">Add</button></div>'+libDatalist()+'</div>';
  h+='<div class="card"><p class="eyebrow">Backup</p><p class="muted" style="margin:0 0 10px">Your data lives only on this phone. Export now and then so you never lose it.</p><div class="row wrapx"><button class="btn ghost" id="exportBtn">Export backup</button><button class="btn ghost" id="importBtn">Import backup</button><button class="btn danger" id="resetPlan">'+(state.confirm==="reset"?"Tap again":"Reset plan")+'</button></div></div>';
  return h;
}

/* ============ events ============ */
function q(sel){return document.querySelectorAll(sel);}
function each(sel,fn){q(sel).forEach(fn);}
function bind(){
  each("[data-start]",function(b){b.onclick=function(){startSession(b.dataset.start);};});
  var bw=document.getElementById("bwSave"); if(bw) bw.onclick=function(){var v=num(document.getElementById("bwIn").value);if(!v||v<30||v>250){toast("Enter weight in kg");return;}S.body=S.body.filter(function(x){return x.date!==todayStr();});S.body.push({date:todayStr(),kg:v});save();toast("Logged "+v+" kg");render();};
  var di=document.getElementById("dismissIntro"); if(di) di.onclick=function(){S.seenIntro=true;save();render();};
  /* workout */
  if(state.draft&&state.tab==="today"&&!state.summary){
    var d=state.draft;
    var dd=document.getElementById("dDate"); if(dd) dd.onchange=function(){d.date=dd.value;saveDraft();};
    each("[data-w]",function(inp){inp.oninput=function(){var p=inp.dataset.w.split("-");var e=d.exercises[+p[0]];e.sets[+p[1]].w=inp.value;
      for(var k=+p[1]+1;k<e.sets.length;k++){if(!e.sets[k].done)e.sets[k].w=inp.value;var o=document.querySelector('[data-w="'+p[0]+'-'+k+'"]');if(o&&!e.sets[k].done)o.value=inp.value;}
      saveDraft();};});
    each("[data-r]",function(inp){inp.oninput=function(){var p=inp.dataset.r.split("-");d.exercises[+p[0]].sets[+p[1]].r=inp.value;saveDraft();};});
    each("[data-chk]",function(b){b.onclick=function(){var p=b.dataset.chk.split("-"),e=d.exercises[+p[0]],x=e.sets[+p[1]];
      if(!x.done){ if(x.r===""&&x.ph) x.r=String(x.ph); if(x.w===""){toast("Enter the weight first");return;} x.done=true; var m=meta(e.name); startRest(m.hi>=15||e.core?60:(m.lo<=8?120:90)); }
      else x.done=false;
      saveDraft(); var y=window.scrollY; render(); window.scrollTo(0,y);};});
    each("[data-addset]",function(b){b.onclick=function(){var e=d.exercises[+b.dataset.addset],l=e.sets[e.sets.length-1]||{w:"",ph:""};e.sets.push({w:l.w,r:"",ph:l.ph||"",done:false});saveDraft();var y=window.scrollY;render();window.scrollTo(0,y);};});
    each("[data-rmset]",function(b){b.onclick=function(){var e=d.exercises[+b.dataset.rmset];e.sets.pop();saveDraft();var y=window.scrollY;render();window.scrollTo(0,y);};});
    each("[data-rmex]",function(b){b.onclick=function(){var i=+b.dataset.rmex;if(state.confirm==="rmex"+i){d.exercises.splice(i,1);state.confirm=null;saveDraft();}else state.confirm="rmex"+i;var y=window.scrollY;render();window.scrollTo(0,y);};});
    each("[data-swap]",function(b){b.onclick=function(){var i=+b.dataset.swap;state.swapOpen=state.swapOpen===i?null:i;var y=window.scrollY;render();window.scrollTo(0,y);var s=document.getElementById("swapIn");if(s)s.focus();};});
    each("[data-doswap]",function(b){b.onclick=function(){var i=+b.dataset.doswap,v=canon(document.getElementById("swapIn").value);if(!v)return;var old=d.exercises[i];var ne=newExFromPlan({name:v,sets:old.sets.length,core:old.core},d.id);d.exercises[i]=ne;state.swapOpen=null;saveDraft();var y=window.scrollY;render();window.scrollTo(0,y);};});
    var ae=document.getElementById("addEx"); if(ae) ae.onclick=function(){var v=canon(document.getElementById("addExIn").value);if(!v)return;d.exercises.push(newExFromPlan({name:v,sets:3},d.id));saveDraft();render();window.scrollTo(0,document.body.scrollHeight);};
    var dc=document.getElementById("discard"); if(dc) dc.onclick=function(){if(state.confirm==="discard"){state.draft=null;state.confirm=null;saveDraft();stopRest();}else state.confirm="discard";render();};
    var fi=document.getElementById("finish"); if(fi) fi.onclick=finishSession;
  }
  var cs=document.getElementById("copySum"); if(cs) cs.onclick=function(){copyText(state.summary.text);};
  var cl=document.getElementById("closeSum"); if(cl) cl.onclick=function(){state.summary=null;render();};
  /* history */
  each("[data-hf]",function(b){b.onclick=function(){state.histFilter=b.dataset.hf;render();};});
  each("[data-hopen]",function(b){b.onclick=function(){state.histOpen[b.dataset.hopen]=!state.histOpen[b.dataset.hopen];var y=window.scrollY;render();window.scrollTo(0,y);};});
  each("[data-hedit]",function(b){b.onclick=function(){editSession(b.dataset.hedit);};});
  each("[data-hcopy]",function(b){b.onclick=function(){var s=S.sessions.filter(function(x){return x.id===b.dataset.hcopy;})[0];var n=sessionSets(s);copyText([s.label+" · "+fmtD(s.date),n+" sets · ~"+kcal(n)+" kcal (rough)"].concat(s.exercises.map(function(e){return"- "+e.name+": "+setSummary(e.sets);})).join("\n"));};});
  each("[data-hdel]",function(b){b.onclick=function(){var id=b.dataset.hdel;if(state.confirm==="del"+id){S.sessions=S.sessions.filter(function(x){return x.id!==id;});save();state.confirm=null;toast("Deleted");}else state.confirm="del"+id;var y=window.scrollY;render();window.scrollTo(0,y);};});
  /* progress */
  var ps=document.getElementById("progSel"); if(ps) ps.onchange=function(){state.prog=ps.value;render();};
  /* plan */
  each("[data-pd]",function(b){b.onclick=function(){state.planDay=b.dataset.pd;render();};});
  var P=S.program[state.planDay];
  each("[data-ps]",function(b){b.onclick=function(){var it=P.items[+b.dataset.ps];it.sets=Math.max(1,Math.min(8,it.sets+(+b.dataset.d)));save();render();};});
  each("[data-pup]",function(b){b.onclick=function(){var i=+b.dataset.pup;if(i>0){var t=P.items[i];P.items[i]=P.items[i-1];P.items[i-1]=t;save();render();}};});
  each("[data-prm]",function(b){b.onclick=function(){var i=+b.dataset.prm;if(state.confirm==="prm"+i){P.items.splice(i,1);state.confirm=null;save();}else{state.confirm="prm"+i;b.textContent="Sure?";return;}render();};});
  each("[data-popen]",function(b){b.onclick=function(){var k=state.planDay+b.dataset.popen;state.planOpen[k]=!state.planOpen[k];render();};});
  function setMeta(name,key,val){S.meta[name]=Object.assign({},S.meta[name]||{});S.meta[name][key]=val;save();}
  each("[data-mlo]",function(i){i.onchange=function(){setMeta(i.dataset.mlo,"lo",parseInt(i.value,10)||8);render();};});
  each("[data-mhi]",function(i){i.onchange=function(){setMeta(i.dataset.mhi,"hi",parseInt(i.value,10)||12);render();};});
  each("[data-minc]",function(i){i.onchange=function(){setMeta(i.dataset.minc,"inc",num(i.value)||0);render();};});
  each("[data-mas]",function(i){i.onchange=function(){setMeta(i.dataset.mas,"assisted",i.checked);render();};});
  var pa=document.getElementById("planAdd"); if(pa) pa.onclick=function(){var v=canon(document.getElementById("planAddIn").value);if(!v)return;P.items.push({name:v,sets:3,core:CORE.test(v)});save();render();};
  var ex=document.getElementById("exportBtn"); if(ex) ex.onclick=function(){var blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="overload-backup-"+todayStr()+".json";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);};
  var im=document.getElementById("importBtn"); if(im) im.onclick=function(){document.getElementById("importFile").click();};
  var rp=document.getElementById("resetPlan"); if(rp) rp.onclick=function(){if(state.confirm==="reset"){S.program=JSON.parse(JSON.stringify(DEFAULT_PROGRAM));state.confirm=null;save();toast("Plan reset");}else state.confirm="reset";render();};
}
document.getElementById("importFile").onchange=function(e){
  var f=e.target.files[0];if(!f)return;var rd=new FileReader();
  rd.onload=function(){try{var j=JSON.parse(rd.result);
    if(Array.isArray(j)){S.sessions=migrateV1(j);}
    else if(j&&j.v===2){S=j;if(!S.body)S.body=[];if(!S.meta)S.meta={};}
    else throw 0;
    save();toast("Imported "+S.sessions.length+" sessions");render();}catch(err){toast("That file isn't an Overload backup");}
    e.target.value="";};
  rd.readAsText(f);
};
render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
